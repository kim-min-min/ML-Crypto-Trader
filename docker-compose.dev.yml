# 로컬 개발용 docker-compose.dev.yml
services:
  # 1. 백엔드 API (FastAPI)
  api:
    build: ./backend
    container_name: cyber_trader_api_dev
    # 💡 --reload 옵션 추가: 파이썬 코드 저장할 때마다 서버 자동 재시작
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # ⭐ 내 윈도우의 backend 폴더를 그대로 연결!
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # 2. 매매 봇 (Python Bot)
  bot:
    build: ./backend
    container_name: cyber_trader_bot_dev
    command: python trading_bot.py
    volumes:
      - ./backend:/app  # ⭐ API와 똑같이 윈도우 폴더 연결
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - api

  # 3. 프론트엔드 (React) - 개발 모드
  frontend:
    # 💡 Nginx가 들어간 실전용 Dockerfile을 무시하고, 순수 Node 환경으로 강제 실행
    image: node:18-alpine
    container_name: cyber_trader_web_dev
    working_dir: /app
    # 💡 패키지 설치하고 개발 서버(npm start) 띄우기
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"  # 로컬 접속용 3000 포트
    volumes:
      - ./frontend:/app  # ⭐ 내 윈도우의 frontend 폴더를 그대로 연결!
    environment:
      - CHOKIDAR_USEPOLLING=true  # 💡 윈도우 도커에서 파일 수정 실시간 감지 필수 옵션
    restart: unless-stopped